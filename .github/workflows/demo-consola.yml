name: Publicar demo de la consola

# Publica la consola web en GitHub Pages compilada en MODO DEMO: los endpoints
# los responde un Service Worker dentro del navegador, con datos equivalentes a
# la semilla de desarrollo. No hay API ni base de datos detrás, y por lo tanto
# tampoco hay nada que exponer.
#
# Es MANUAL a propósito. Publicar es una decisión, no un efecto secundario de
# hacer push: quien quiera que cada merge a main republique, agrega aquí
#   push:
#     branches: [main]
#     paths: ['erp-web/**']
#
# Requiere tener Pages habilitado en el repositorio con "GitHub Actions" como
# origen (Settings → Pages → Build and deployment → Source).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si se lanzan dos, la segunda espera en vez de
# pelear con la primera por el mismo destino.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar en modo demo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: erp-web

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: erp-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm run test

      - name: Compilar
        # Pages sirve el sitio bajo /<nombre-del-repositorio>/, no en la raíz del
        # dominio. Sin esta base, todas las rutas de los assets quedan rotas.
        run: npm run build:demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Preparar el enrutado del lado del cliente
        # Pages sirve archivos estáticos y no sabe nada de React Router: pedir
        # /ventas/nueva directamente —recargar, o abrir un enlace compartido—
        # busca un archivo que no existe. Pages devuelve 404.html cuando no
        # encuentra la ruta, así que una copia del index deja que la aplicación
        # arranque y resuelva la ruta por su cuenta. Es el equivalente estático
        # del `try_files` que hace nginx.conf en la imagen Docker.
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: erp-web/dist

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Desplegar en Pages
        id: despliegue
        uses: actions/deploy-pages@v4
