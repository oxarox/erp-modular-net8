# Entorno local completo: base de datos + API + consola web.
#   docker compose up --build
#   Consola: http://localhost:5173
#   API:     http://localhost:8080/api/salud
#   Swagger: http://localhost:8080/swagger  (solo con ASPNETCORE_ENVIRONMENT=Development)
#
# Las claves de este archivo son de juguete y solo sirven en local.
services:
  base-de-datos:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ClaveLocal_Dev123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - datos-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      base-de-datos:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=base-de-datos,1433;Database=ErpModular;User Id=sa;Password=ClaveLocal_Dev123;TrustServerCertificate=True;"
      Jwt__ClaveFirma: "clave-solo-para-desarrollo-de-al-menos-32-caracteres"
      Cors__OrigenesPermitidos__0: "http://localhost:5173"
    ports:
      - "8080:8080"

  consola:
    build:
      context: ./erp-web
      args:
        # Vite incrusta esta URL en el bundle durante la COMPILACIÓN, no en el
        # arranque. Es el puerto que este archivo publica para la API vista desde
        # el navegador del anfitrión: quien hace la petición es el navegador, no
        # el contenedor, así que "http://api:8080" no serviría.
        VITE_API_URL: "http://localhost:8080"
    depends_on:
      - api
    ports:
      # Se mantiene el 5173 de Vite aunque aquí sirva nginx: es el origen que la
      # API ya autoriza en Cors__OrigenesPermitidos, y cambiarlo obligaría a
      # tocar las dos puntas.
      - "5173:80"

volumes:
  datos-sql:
