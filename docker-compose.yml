# Entorno local completo: base de datos + API.
#   docker compose up --build
#   API:     http://localhost:8080/api/salud
#   Swagger: http://localhost:8080/swagger  (solo con ASPNETCORE_ENVIRONMENT=Development)
#
# Las claves de este archivo son de juguete y solo sirven en local.
services:
  base-de-datos:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ClaveLocal_Dev123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - datos-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      base-de-datos:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=base-de-datos,1433;Database=ErpModular;User Id=sa;Password=ClaveLocal_Dev123;TrustServerCertificate=True;"
      Jwt__ClaveFirma: "clave-solo-para-desarrollo-de-al-menos-32-caracteres"
      Cors__OrigenesPermitidos__0: "http://localhost:5173"
    ports:
      - "8080:8080"

volumes:
  datos-sql:
