server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Los assets llevan hash en el nombre, así que su contenido nunca cambia:
    # se pueden cachear para siempre sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html SÍ cambia en cada despliegue y es quien apunta a los assets
    # nuevos. Cachearlo dejaría a la gente con la versión anterior hasta que
    # limpie el navegador.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # El Service Worker del modo demo se sirve sin caché por el mismo motivo,
    # y además necesita alcance sobre la raíz del sitio.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Enrutado del lado del cliente: /ventas/nueva no es un archivo, es una ruta
    # de React Router. Sin este fallback, recargar en cualquier pantalla que no
    # sea la raíz devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
